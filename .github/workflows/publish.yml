name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup update stable

      - name: Lint
        run: cargo clippy --all-targets --all-features

      - name: Publish if the version is new
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          if curl -sSf -o /dev/null \
               -H 'User-Agent: oci-rust-sdk publish workflow' \
               "https://crates.io/api/v1/crates/oci-rust-sdk/$version"; then
            echo "$version is already on crates.io, nothing to publish"
            exit 0
          fi
          echo "publishing $version"
          cargo publish
